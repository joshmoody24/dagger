    </div>
    <div class="nav">
      <button class="nb" id="prevBtn" aria-label="Previous" ${i <= 0 ? "disabled" : ""}>‹</button>
      <button class="nb" id="nextBtn" aria-label="Skip to next" ${i >= ORDER.length - 1 ? "disabled" : ""}>›</button>
      <button class="pos${done ? " done" : ""}" id="posBtn" aria-label="${done ? "Read. Tap to mark unread" : "Not read yet"}">${done ? "✓ " : ""}${i >= 0 ? `${i + 1}/${ORDER.length}` : ""}</button>
      <button class="go" id="goBtn">✓ next</button>
    </div>`;
  el.querySelector(".sb").scrollTop = 0;
}

function drawChrome(){
  $("#edgeBtn").setAttribute("aria-expanded", state.edgesOpen);
  const filtered = state.facets.size < FACETS.length || state.res.size < RESOLVERS.length;
  $("#edgeBtn").textContent = filtered ? "references •" : "references";
  $("#edges").hidden = !state.edgesOpen;
  $("#edges").innerHTML = `<span class="gl">in</span>`
    + FACETS.map(([k, l]) => `<button class="chip" data-facet="${k}" aria-pressed="${state.facets.has(k)}">${l}<small>${EDGES.filter(e => e.facet === k).length}</small></button>`).join("")
    + `<span class="gl">found by</span>`
    + RESOLVERS.map(([k, l]) => `<button class="chip" data-res="${k}" aria-pressed="${state.res.has(k)}">${l}<small>${EDGES.filter(e => e.resolver === k).length}</small></button>`).join("");
  $("#prog").textContent = `${VIS.filter(n => reviewed.has(n)).length}/${VIS.length}`;
}

const wide = () => matchMedia("(min-width:900px)").matches;
function render(){
  ORDER = readingOrder();
  if (wide() && !state.selected){ state.selected = ORDER[0]; state.sheet = "half"; }
  drawChrome();
  drawGraph();
  drawSheet();
}
function visibleH(el){
  const r = el.getBoundingClientRect();
  if (state.sheet === "closed" || wide()) return r.height;
  return Math.max(80, window.innerHeight * 0.42 - r.top);
}
function reveal(id){
  requestAnimationFrame(() => {
    if (!LAY) return;
    const p = LAY.pos[LAY.rep(id)]; if (!p) return;
    const g = $("#graph"), s = g.querySelector("svg").getBoundingClientRect().width / LAY.W;
    g.scrollTo({left:(p.x + p.w/2)*s - g.clientWidth/2, top:(p.y + NH/2)*s - visibleH(g)/2, behavior:"smooth"});
  });
}
function select(id){
  state.selected = id;
  if (state.sheet === "closed") state.sheet = "half";
  if (inGraph(id)){ state.ov.set("p:" + DEF[id].g, true); state.ov.set("f:" + DEF[id].file, true); }
  render(); reveal(id);
}

document.addEventListener("click", e => {
  const t = e.target;
  const pk = t.closest("[data-pkg]"); if (pk){ const k = "p:" + pk.dataset.pkg, open = LAY.units.find(u => u.id === pk.dataset.pkg)?.box; state.ov.set(k, !open); render(); return; }
  const fl = t.closest("[data-file]"); if (fl){ state.ov.set("p:" + FILEPKG[fl.dataset.file], true); state.ov.set("f:" + fl.dataset.file, true); render(); return; }
  const op = t.closest("[data-open]"); if (op){ select(op.dataset.open); return; }
  const rs = t.closest("[data-res]"); if (rs){ const k = rs.dataset.res; state.res.has(k) ? state.res.delete(k) : state.res.add(k); render(); return; }
  const fc = t.closest("[data-facet]"); if (fc){ const k = fc.dataset.facet; state.facets.has(k) ? state.facets.delete(k) : state.facets.add(k); render(); return; }
  if (t.closest("#edgeBtn")){ state.edgesOpen = !state.edgesOpen; render(); return; }
  if (t.closest("#closeBtn")){ state.sheet = "closed"; state.selected = null; render(); return; }
  if (t.closest("#expBtn")){ state.sheet = state.sheet === "full" ? "half" : "full"; drawSheet(); return; }
  if (t.closest("#prevBtn")){ const i = ORDER.indexOf(state.selected); if (i > 0) select(ORDER[i - 1]); return; }
  if (t.closest("#nextBtn")){ const i = ORDER.indexOf(state.selected); select(ORDER[Math.min(ORDER.length - 1, i + 1)]); return; }
  if (t.closest("#posBtn")){ const id = state.selected; if (reviewed.has(id)){ reviewed.delete(id); saveReviewed(); render(); } return; }
  if (t.closest("#goBtn")){
    const id = state.selected; reviewed.add(id); saveReviewed();
    const i = ORDER.indexOf(id);
    if (i < ORDER.length - 1) select(ORDER[i + 1]); else render();
    return;
  }
  if (t.closest("#graph") && !t.closest(".nd") && state.selected && !wide()){ state.selected = null; state.sheet = "closed"; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.selected && !wide()){ state.selected = null; state.sheet = "closed"; render(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".nd")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles:true})); }
  if (e.key === "ArrowRight" && state.selected) $("#nextBtn")?.click();
  if (e.key === "ArrowLeft" && state.selected) $("#prevBtn")?.click();
  if (e.key === "Enter" && state.selected && !e.target.matches("button, .nd")) $("#goBtn")?.click();
});
/* Default folding: show the most detail that stays readable at this screen width.
   Open everything, then fold the widest package until the graph fits at ≥ 50% scale. */
function autoFold(){
  const ov = new Map(), avail = $("#graph").clientWidth || window.innerWidth;
  for (;;){
    const L = layout({level:"def", ov});
    if (avail / L.W >= 0.5) return ov;
    const open = L.units.filter(u => u.box).sort((a, b) => b.W - a.W);
    if (!open.length) return ov;
    ov.set("p:" + open[0].id, false);
  }
}
state.ov = autoFold();
render();
</script>
</body>
</html>
