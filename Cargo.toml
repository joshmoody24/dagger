[workspace]
members = ["adapters/git", "adapters/rust", "crates/cli", "adapters/lsp", "crates/core", "crates/lsp-client", "crates/protocol", "crates/typescript"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/joshmoody24/dagger"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
