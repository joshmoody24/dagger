[workspace]
members = ["adapters/git", "adapters/rust", "crates/cli", "crates/core", "crates/protocol"]
# Adapters install separately, so a plain build stays to the tool itself.
default-members = ["crates/cli", "crates/core", "crates/protocol"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
