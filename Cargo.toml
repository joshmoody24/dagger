[workspace]
members = ["adapters/git", "adapters/rust", "crates/cli", "adapters/lsp", "crates/core", "crates/lsp-client", "crates/protocol", "crates/typescript"]
# The built-in adapters are part of the one dagger binary, so a plain build is everything.
# The window around the page is its own thing: it pulls in a webview and everything under it,
# which has no business slowing down a build of the tool.
exclude = ["ui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
