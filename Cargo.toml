[workspace]
members = ["adapters/git", "adapters/rust", "crates/cli", "adapters/lsp", "crates/core", "crates/lsp-client", "crates/protocol", "crates/typescript"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
