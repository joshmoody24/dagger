[snapshots]
adapter = "git"

[[extractors]]
adapter = "rust"

# The page is TypeScript so the same server that reads a real TypeScript repository can
# read dagger's own UI. Without it every file here is one opaque blob, and a review of the
# UI says nothing about what depends on what.
[[extractors]]
adapter = "lsp"
include = ["**/*.ts", "**/*.tsx"]
settings = { server = ["tsc", "--lsp", "--stdio"] }

[review]
ignore = ["Cargo.lock", "flake.lock", "dagger-demo.html"]

[grouping]
name = "package"
markers = ["Cargo.toml", "package.json"]
